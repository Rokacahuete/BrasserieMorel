    <header>
        <div class = "top">
            <div class = "items">
                <span>
                    <a href = "index.html">

                </span>

                <div class = "buttons-container not-on-mobile">
                    <button onclick = "document.location.href = '#beer-dispensers'"><b>Tireuses</b></button>
                    <button onclick = "document.location.href = '#events'"><b>Évènements</b></button>
                    <button onclick = "document.location.href = '#bottom'"><b>Contact</b></button>
                </div>
            </div>
            <div class = "drop-down-menu centered">
                <div id = "header-drop-down-menu" style = "width: 100%">
                    <button onclick = "document.location.href = '#beer-dispensers'">Tireuses</button>
                    <button onclick = "document.location.href = '#events'">Évènements</button>
                    <button onclick = "document.location.href = '#bottom'">Contact</button>
                </div>
                <button onclick = "DropDownMenuSwitch()">V</button>
            </div>
        </div>
        <div class = "centered">
            <div class = "banner">
                <img src = "Images/whistler-village-beer-festival.jpg">
            </div>
        </div>
    </header>
    <div class = "centered">
        <div class = "events section" id = "events">
            <h1>Nos évènements</h1>
            <div class = "centered" style = "width: 100%;">
                <div class = "items container" id = "event-container">
                    <img id = "event-img" src = "Images/">
                </div>
                <h2 id = "event-title">Event Name</h2>
                <div class = "event-date" id = "event-date">00/00</div>
                <div class = "items" id = "events-arrows">
                    <button class = "arrow" onclick = "UpdateEvent(-1, true)">Précédent</button>
                    <button class = "arrow" onclick = "UpdateEvent(1, true)">Suivant</button>
                </div>
            </div>
        </div>
        <div class = "beers section" id = "beers">
            <h1>Nos bières</h1>
            <div class = "items">
                <div class = "centered beer" id = "beer">
                    <h2>La gamme permanante</h2>
                    <img src = "Images/beers.png" id = "beer-img">
                    <div class = "beer-color" id = "beer-color"></div>
                    <div class = "text name" id = "beer-name">Toute la gamme</div>
                    <div class = "items" id = "beer-arrows">
                        <button class = "arrow text" onclick = "UpdateBeers(-1, true)">Précédente</button>
                        <button class = "arrow text" onclick = "UpdateBeers(1, true)">Suivante</button>
                    </div>
                </div>
                <div class = "centered beer beer-event" id = "beer-event">
                    <h2>Et en ce moment</h2>
                    <img id = "event-beer-img" src = "Images/IMG-20241113-WA0001.jpg">
                    <div class = "beer-color" id = "event-beer-color"></div>
                    <div class = "text name" id = "event-beer-name">Name</div>
                    <div class = "items" id = "event-beers-arrows">
                        <button class = "arrow text" onclick = "UpdateEventBeers(-1, true)">Précédente</button>
                        <button class = "arrow text" onclick = "UpdateEventBeers(1, true)">Suivante</button>
                    </div>
                </div>
            </div>
        </div>
        <div class = "beer-dispensers section" id = "beer-dispensers">
            <h1>Tireuses</h1>
            <div class = "items">
                <div class = "dispenser">
                    <h2>Tireuse simple</h2>
                    <img src = "Images/WhatsApp Image 2025-08-24 à 11.49.05_59e1f832.jpg">
                </div>
                <div class = "dispenser">
                    <h2>Tireuse double</h2>
                    <img src = "Images/WhatsApp Image 2025-08-24 à 11.49.39_e365d1d5.jpg">
                </div>
            </div>
            <button onclick = "window.open('Documents/Installation tireuse.pdf', '_blank')">Installer une tireuse</button>
        </div>
        <div class = "section" id = "sell-points">
            <h1>Nos points de vente</h1>
            <div class = "carousel" id = "sell-point-list">
            </div>
            <div class = "items" id = "sell-points-arrows">
                <button class = "arrow" onclick = "SwitchSellPoints(-1)">LEFT</button>
                <button class = "arrow" onclick = "SwitchSellPoints(1)">RIGHT</button>
            </div>
            <button onclick = "window.open('https:\/\/maps.app.goo.gl/erc8bELveFobgdnF7', '_blank', 'noopener,noreferrer');" id = "all-sell-points-button">Tous nos points de vente ici</button>
        </div>
        <div class = "section" id = "interviews">
            <h1>Interviews</h1>
            <div class = "items" id = "interview-list">
            </div>
            <button onclick = "document.location.href = 'Pages/interviews.html'" id = "all-interviews-button">Toutes nos interviews</button>
        </div>
    </div>
    <footer>
        <div class = "bottom items" id = "bottom">
            <div class = "centered">
                <h2 class = "title">La Brasserie</h2>
                <p class = "item">6bis AV Jean Jaurès, 91690 Saclas</p>
                <p class = "item">Ouvert le samedi de 10h à 12h30</p>
            </div>
            <div class = "centered">
                <h2 class = "title">Réseaux Sociaux</h2>
                <div class = "items social-medias">
                    <div class = "social-media item">
                        <a href = "tel:+33616740608" style = "background: #25D366;">
                            <img src = "Images/Logo-Tel.png">
                        </a>
                        <img src = "Images/Logo-Tel.png">
                    </div>
                    <div class = "social-media item">
                        <a href = "mailto:brasseriemorel@gmail.com" style = "background: #10afd6;">
                            <img src = "Images/Logo-Mail.png">
                        </a>
                        <img src = "Images/Logo-Mail.png">
                    </div>
                    <div class = "social-media item">
                        <a href = "https://www.instagram.com/brasserie_morel/" target = "_blank" rel = "noopener noreferrer" style = "background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%);">
                            <img src = "Images/Logo-Instagram.png">
                        </a>
                        <img src = "Images/Logo-Instagram.png">
                    </div>
                    <div class = "social-media item">
                        <a href = "https://www.facebook.com/BrasserieMorel91/" target = "_blank" rel = "noopener noreferrer" style = "background: #1877F2">
                            <img src = "Images/Logo-Facebook.png">
                        </a>
                        <img src = "Images/Logo-Facebook.png">
                    </div>
                </div>
            </div>
        </div>
    </footer>
